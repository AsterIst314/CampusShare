name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, pdo_mysql

      - name: Check PHP syntax
        run: |
          find src/front-end -type f -name "*.php" -print0 | xargs -0 -r -n 1 php -l

      - name: Check essential files
        run: |
          test -f src/front-end/index.php || {
            echo "Error: src/front-end/index.php is missing."
            exit 1
          }
          test -f src/back-end/database_campusshare.sql || {
            echo "Error: database schema file is missing."
            exit 1
          }
          echo "Essential files found."

      - name: Check PHP server starts
        run: |
          php -S 127.0.0.1:8000 -t src/front-end > /tmp/campusshare-php.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 10); do
            if grep -q "Development Server" /tmp/campusshare-php.log; then
              echo "PHP development server started successfully."
              exit 0
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/campusshare-php.log
              echo "Error: PHP server exited before starting."
              exit 1
            fi

            sleep 1
          done

          cat /tmp/campusshare-php.log
          echo "Error: PHP server did not report startup in time."
          exit 1
